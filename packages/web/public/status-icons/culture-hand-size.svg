<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 116" width="128" height="116" role="img" aria-label="+1 culture hand size">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c98a"/>
      <stop offset="0.5" stop-color="#9c8c4c"/>
      <stop offset="1" stop-color="#6f6334"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#f4f2ea"/>
      <stop offset="1" stop-color="#c9c8bd"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdd6d8"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a9094"/>
      <stop offset="1" stop-color="#4e5457"/>
    </linearGradient>
  </defs>
  <!-- base ribbon under the medallion -->
  <path d="M18 100 Q30 92 46 98 L82 98 Q98 92 110 100 L104 108 Q92 104 82 106 L46 106 Q36 104 24 108 Z" fill="url(#base)" stroke="#33383b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M24 100.500 Q34 96 46 100 L82 100" fill="none" stroke="#c5cacc" stroke-width="1.500" stroke-linecap="round" opacity=".7"/>
  <!-- ring and disc -->
  <ellipse cx="64" cy="54" rx="45" ry="47" fill="url(#disc)" stroke="url(#ring)" stroke-width="6"/>
  <ellipse cx="64" cy="54" rx="40" ry="42" fill="none" stroke="#fff" stroke-width="1" opacity=".55"/>
  <!-- +1: shadow, then face -->
  <g id="mark">
    <polygon points="20,50 32,50 32,38 48,38 48,50 60,50 60,66 48,66 48,78 32,78 32,66 20,66"/>
    <polygon points="70,44 84,32 98,32 98,82 84,82 84,49 70,55"/>
  </g>
  <use href="#mark" x="2.500" y="3.500" fill="#2b3438" opacity=".35"/>
  <use href="#mark" fill="url(#face)" stroke="#34454c" stroke-width="3.200" stroke-linejoin="round" paint-order="stroke"/>
  <use href="#mark" fill="none" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" opacity=".8" transform="translate(-.6 -.6)"/>
</svg>
