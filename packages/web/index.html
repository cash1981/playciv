<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Civilization — playciv</title>
    <script>
      try {
        if (localStorage.getItem('civ-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch {
        // The app falls back to dark when local storage is unavailable.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
