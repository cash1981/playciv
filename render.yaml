# Render Blueprint for the playciv API — the Hono/Node server (packages/server)
# talking to MongoDB Atlas. The SPA and the playciv.app domain live on Cloudflare;
# the Cloudflare Worker proxies /api/* to this service.
#
# Set MONGO_URL, TOKEN_SECRET and RESEND_API_KEY in the Render dashboard (they
# are marked sync: false so they are not stored in the repo). Render provides
# PORT.
services:
  - type: web
    name: playciv-api
    runtime: node
    plan: free
    # --prod=false so devDependencies (typescript) are installed for the build,
    # even though Render sets NODE_ENV=production. Engine is built before the
    # server because the server imports its built types.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @civ/engine build && pnpm --filter @civ/server build
    startCommand: node packages/server/dist/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: TOKEN_SECRET
        sync: false
      - key: MONGO_DB
        value: playciv
      # Resend API key for notification email (issue #30). Unset disables mail.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: noreply@playciv.app
      - key: APP_ORIGIN
        value: https://playciv.app
      # Java emailed every account on game creation; keep it off until ready.
      - key: MAIL_BROADCAST_NEW_GAMES
        value: "false"
